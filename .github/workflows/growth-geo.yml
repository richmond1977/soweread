name: Growth GEO check

# 只跑 GEO 引用追蹤（scripts/growth/geo_citations.mjs），不跑 GSC／SERP／週報。
# 用途：補完 Gemini 額度或換 key 之後，先用少量題目確認 API 可用，不必重跑整份
# 週報（收錄檢查 200 多次、Serper 免費額度都會被重複消耗）。
#
# 預設 limit=2、dry_run=true：只問 2 題、不寫資料庫。確認可用後，limit 留空、
# dry_run 取消，就會跑完整 24 題並寫入 CitationBatchJob，下一次週報即會帶上。

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '只問前 N 題（留空＝全部 24 題）'
        type: string
        default: '2'
      dry_run:
        description: '不寫入資料庫'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: growth-geo-check
  cancel-in-progress: false

jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: GEO citation check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          GEO_LIMIT: ${{ inputs.limit }}
          GEO_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set --
          if [ -n "$GEO_LIMIT" ]; then set -- "$@" --limit "$GEO_LIMIT"; fi
          if [ "$GEO_DRY_RUN" = "true" ]; then set -- "$@" --dry-run; fi
          node scripts/growth/geo_citations.mjs "$@"
