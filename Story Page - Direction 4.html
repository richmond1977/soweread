<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body, #root {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Georgia', 'Noto Serif TC', serif;
      background: #faf8f5;
      color: #3d3d3d;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    :root {
      --primary: #6b5b4d;
      --primary-light: #8b7d73;
      --bg-light: #faf8f5;
      --bg-medium: #f0ebe5;
      --bg-dark: #e8dfd6;
      --text-dark: #1a1a1a;
      --text-medium: #3d3d3d;
      --text-light: #666666;
      --text-muted: #999999;
      --white: #ffffff;
    }

    header {
      background: var(--white);
      border-bottom: 1px solid var(--bg-dark);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 400;
      color: var(--primary);
      letter-spacing: -0.01em;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.95rem;
      color: var(--text-medium);
      transition: color 0.3s ease;
      border-bottom: 2px solid transparent;
      padding-bottom: 4px;
    }

    .nav-links a:hover {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .btn-cta {
      background: var(--primary);
      color: var(--white);
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      font-family: 'Helvetica Neue', sans-serif;

    .btn-cta:hover {
      background: #5a4d42;
      box-shadow: 0 4px 12px rgba(107, 91, 77, 0.25);

      padding: 80px 40px;
      text-align: center;
      border-bottom: 1px solid var(--bg-dark);
    }

      color: var(--text-dark);
      font-weight: 400;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }

    .page-hero p {
      font-size: 1.1rem;
      color: var(--text-light);
      max-width: 700px;
      margin: 0 auto;
    }

      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 40px;
    }

      font-size: 2rem;
      color: var(--text-dark);
      margin: 60px 0 30px;
      font-weight: 400;
    }

      font-size: 1.3rem;
      color: var(--text-dark);
      margin: 40px 0 20px;
      font-weight: 400;

      padding: 40px;
      border-radius: 6px;

      text-align: center;
