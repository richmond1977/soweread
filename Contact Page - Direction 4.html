<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡我們 - 潤讀 So We Read</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body, #root {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Georgia', 'Noto Serif TC', serif;
      background: #faf8f5;
      color: #3d3d3d;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    :root {
      --primary: #6b5b4d;
      --primary-light: #8b7d73;
      --bg-light: #faf8f5;
      --bg-medium: #f0ebe5;
      --bg-dark: #e8dfd6;
      --text-dark: #1a1a1a;
      --text-medium: #3d3d3d;
      --text-light: #666666;
      --text-muted: #999999;
      --white: #ffffff;
    }

    header {
      background: var(--white);
      border-bottom: 1px solid var(--bg-dark);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 400;
      color: var(--primary);
      letter-spacing: -0.01em;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.95rem;
      color: var(--text-medium);
      transition: color 0.3s ease;
      border-bottom: 2px solid transparent;
      padding-bottom: 4px;
    }

    .nav-links a:hover {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .btn-cta {
      background: var(--primary);
      color: var(--white);
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      font-family: 'Helvetica Neue', sans-serif;
    }

    .btn-cta:hover {
      background: #5a4d42;
      box-shadow: 0 4px 12px rgba(107, 91, 77, 0.25);
    }

    .page-hero {
      background: linear-gradient(135deg, #f0ebe5 0%, #faf8f5 100%);
      padding: 60px 40px;
      text-align: center;
      border-bottom: 1px solid var(--bg-dark);
    }

    .page-hero h1 {
      font-size: 2.8rem;
      color: var(--text-dark);
      font-weight: 400;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }

    .page-hero p {
      font-size: 1.1rem;
      color: var(--text-medium);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 40px;
    }

    h2 {
      font-size: 1.8rem;
      color: var(--text-dark);
      margin: 40px 0 30px;
      font-weight: 400;
      border-bottom: 2px solid var(--bg-dark);
      padding-bottom: 15px;
    }

    h3 {
      font-size: 1.2rem;
      color: var(--text-dark);
      margin: 25px 0 15px;
      font-weight: 600;
    }

    p {
      font-size: 1rem;
      line-height: 1.8;
      color: var(--text-medium);
      margin-bottom: 20px;
    }

    /* Contact Form */
    .contact-form {
      background: var(--white);
      padding: 40px;
      border-radius: 6px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      margin: 40px 0;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--bg-dark);
      border-radius: 4px;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      color: var(--text-medium);
      transition: border-color 0.3s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(107, 91, 77, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 150px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .submit-btn {
      background: var(--primary);
      color: var(--white);
      padding: 14px 32px;
      border: none;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Helvetica Neue', sans-serif;
    }

    .submit-btn:hover {
      background: #5a4d42;
      box-shadow: 0 4px 12px rgba(107, 91, 77, 0.25);
    }

    /* Contact Info */
    .contact-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 40px;
      margin: 60px 0;
    }

    .info-card {
      text-align: center;
    }

    .info-card h4 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 12px;
    }

    .info-card p {
      font-size: 0.95rem;
      color: var(--text-medium);
    }

    footer {
      background: var(--text-dark);
      color: var(--white);
      padding: 60px 40px 30px;
      margin-top: 80px;
    }

    .footer-content {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 40px;
      margin-bottom: 40px;
    }

    .footer-section h4 {
      font-size: 1rem;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .footer-section ul {
      list-style: none;
      margin-left: 0;
    }

    .footer-section li {
      margin-bottom: 12px;
    }

    .footer-section a {
      color: rgba(255, 255, 255, 0.7);
      transition: color 0.3s ease;
    }

    .footer-section a:hover {
      color: var(--white);
    }

    .footer-bottom {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 30px;
      text-align: center;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (max-width: 768px) {
      .page-hero h1 {
        font-size: 2rem;
      }

      nav {
        flex-direction: column;
        gap: 16px;
      }

      .nav-links {
        gap: 16px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .contact-form {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    function ContactPage() {
      const [formData, setFormData] = React.useState({
        name: '',
        email: '',
        subject: '',
        message: ''
      });

      const [submitted, setSubmitted] = React.useState(false);

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (formData.name && formData.email && formData.subject && formData.message) {
          setSubmitted(true);
          setFormData({ name: '', email: '', subject: '', message: '' });
          setTimeout(() => setSubmitted(false), 3000);
        }
      };

      return (
        <>
          {/* Header */}
          <header>
            <nav>
              <div className="logo" onClick={() => window.location.href = 'Homepage - Direction 4.html'}>潤讀 So We Read</div>
              <ul className="nav-links">
                <li><a href="Homepage - Direction 4.html">首頁</a></li>
                <li><a href="Story Page - Direction 4.html">潤讀故事</a></li>
                <li><a href="#blog">部落格</a></li>
                <li><a href="#contact">聯絡</a></li>
                <li><a href="Privacy Page - Direction 4.html">權利聲明</a></li>
              </ul>
              <button className="btn-cta">開始閱讀</button>
            </nav>
          </header>

          {/* Page Hero */}
          <section className="page-hero">
            <h1>聯絡我們</h1>
            <p>有任何問題或建議？我們很樂意聽到您的意見。</p>
          </section>

          {/* Main Content */}
          <div className="container">
            <h2>聯絡表單</h2>
            <p>請填寫下方表單，我們會在 24 小時內與您聯繫。</p>

            {submitted && (
              <div style={{
                background: '#e8f5e9',
                border: '1px solid #81c784',
                color: '#2e7d32',
                padding: '16px',
                borderRadius: '4px',
                marginBottom: '24px',
                fontSize: '0.95rem'
              }}>
                ✓ 感謝您的訊息！我們已收到您的聯絡，將盡快回應。
              </div>
            )}

            <form className="contact-form" onSubmit={handleSubmit}>
              <div className="form-row">
                <div className="form-group">
                  <label htmlFor="name">姓名 *</label>
                  <input
                    type="text"
                    id="name"
                    name="name"
                    value={formData.name}
                    onChange={handleChange}
                    required
                  />
                </div>
                <div className="form-group">
                  <label htmlFor="email">電子郵件 *</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    value={formData.email}
                    onChange={handleChange}
                    required
                  />
                </div>
              </div>

              <div className="form-group">
                <label htmlFor="subject">主旨 *</label>
                <input
                  type="text"
                  id="subject"
                  name="subject"
                  value={formData.subject}
                  onChange={handleChange}
                  required
                />
              </div>

              <div className="form-group">
                <label htmlFor="message">訊息 *</label>
                <textarea
                  id="message"
                  name="message"
                  value={formData.message}
                  onChange={handleChange}
                  required
                />
              </div>

              <button type="submit" className="submit-btn">送出訊息</button>
            </form>

            <h2>聯絡資訊</h2>
            <div className="contact-info">
              <div className="info-card">
                <h4>社群媒體</h4>
                <p>
                  <a href="#facebook">Facebook</a> | <a href="#instagram">Instagram</a> | <a href="#twitter">Twitter</a>
                </p>
              </div>
              <div className="info-card">
                <h4>營業時間</h4>
                <p>週一至週五 09:00 - 18:00 (台灣時間)</p>
              </div>
            </div>
          </div>

          {/* Footer */}
          <footer>
            <div className="footer-content">
              <div className="footer-section">
                <h4>潤讀 So We Read</h4>
                <ul>
                  <li><a href="Homepage - Direction 4.html">首頁</a></li>
                  <li><a href="Story Page - Direction 4.html">潤讀故事</a></li>
                  <li><a href="#contact">聯絡</a></li>
                </ul>
              </div>
              <div className="footer-section">
                <h4>內容</h4>
                <ul>
                  <li><a href="#blog">部落格</a></li>
                  <li><a href="#categories">分類</a></li>
                  <li><a href="#archive">文章存檔</a></li>
                </ul>
              </div>
              <div className="footer-section">
                <h4>社區</h4>
                <ul>
                  <li><a href="#discussions">討論區</a></li>
                  <li><a href="#contact">聯絡我們</a></li>
                  <li><a href="#subscribe">訂閱</a></li>
                </ul>
              </div>
              <div className="footer-section">
                <h4>法律</h4>
                <ul>
                  <li><a href="Privacy Page - Direction 4.html">權利聲明</a></li>
                  <li><a href="#terms">使用條款</a></li>
                  <li><a href="#cookies">Cookie 設定</a></li>
                </ul>
              </div>
            </div>
            <div className="footer-bottom">
              <p>© 2026 潤讀 So We Read. 版權所有。</p>
            </div>
          </footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ContactPage />);
  </script>
</body>
</html>
